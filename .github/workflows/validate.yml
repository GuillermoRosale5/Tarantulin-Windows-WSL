name: Validación

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.8"
      - name: Comprobar dependencias fijadas
        run: uv lock --check
      - name: Comprobar sintaxis Bash
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Comprobar sintaxis Python
        run: python -m compileall -q tarantulin scripts
      - name: Comprobar regresiones herméticas
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Comprobar la estructura del repositorio
        run: |
          test "$(tr -d '\r\n' < .tarantulin/source.marker)" = tarantulin-windows-source-v1
          test ! -d external
          test ! -d logs_tarantulin_mjx
          test ! -d .venv
          test -f scripts/tarantulin.sh
          test -f scripts/curriculo_automatico_tarantulin.sh
          test -f tarantulin/entorno_tarantulin_mjx.py
          test -f tarantulin/curriculo_recompensas.py
          for obsolete in \
            scripts/tarantulin_wsl.sh \
            scripts/curriculum_auto_tarantulin.sh \
            scripts/install_windows.ps1 \
            scripts/script_instalador_wsl_jax_mujoco_playground.ps1 \
            tarantulin/tarantulin_mjx_env.py \
            tarantulin/reward_curriculum.py; do
            test ! -e "$obsolete"
          done
      - name: Comprobar la red preentrenada
        run: bash tests/test_pretrained_model.sh
      - name: Comprobar rutas y procesos
        run: |
          bash tests/test_run_path_safety.sh "$PWD"
          bash tests/test_process_identity.sh "$PWD"
          python tests/test_rutas_visualizacion.py
      - name: Comprobar la sincronización con WSL
        run: bash tests/test_sync_runtime.sh "$PWD" 0123456789abcdef

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Comprobar sintaxis PowerShell
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $errors += $parseErrors
          }
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Comprobar instalador y lanzadores de Windows
        shell: powershell
        run: .\tests\test_windows_packaging.ps1
