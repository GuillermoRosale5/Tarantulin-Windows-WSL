[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tarantulin-sim2real"
version = "0.6.0"
description = "Capa reproducible MuJoCo MJX + JAX para TARANTULIN"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "brax==0.14.2",
  "flax==0.11.2",
  "jax==0.6.2",
  "jaxlib==0.6.2",
  "matplotlib>=3.10,<3.11",
  "ml-collections==1.1.0",
  "mujoco==3.6.0",
  "mujoco-mjx==3.6.0",
  "optax==0.2.6",
  "orbax-checkpoint==0.11.31",
  "playground @ git+https://github.com/google-deepmind/mujoco_playground.git@9c2dce4a3519cd4bb9d299bf28a6ef3f5086844b",
  "warp-lang==1.11.0",
]

[project.optional-dependencies]
nvidia = ["jax[cuda12]==0.6.2"]

[dependency-groups]
dev = ["ruff>=0.12,<0.13"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tarantulin"]

[tool.hatch.build.targets.sdist]
include = ["tarantulin", "scripts", "pyproject.toml", "uv.lock", "README.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
